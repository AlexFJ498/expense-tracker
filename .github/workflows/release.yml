name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: npm ci
      - name: Verify macOS build architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: npm run tauri build -- --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Normalize release asset names
        run: node scripts/release-manifest.mjs --normalize-bundles src-tauri/target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-manifest.node-tests.mjs
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate static updater manifest
        run: node scripts/release-manifest.mjs
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Generate checksums
        run: |
          find artifacts -type f -exec sha256sum {} \; > checksums.txt
          sha256sum latest.json >> checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            latest.json
            checksums.txt
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/windows/**
            artifacts/linux/**
            artifacts/macos/**
            artifacts/release-metadata/latest.json
            artifacts/release-metadata/checksums.txt
          generate_release_notes: true
